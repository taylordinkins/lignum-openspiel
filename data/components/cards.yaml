# Lignum card data (RULES_SPEC R-005, R-037, R-055, R-056, R-070). Card values live only here.
# Transcribed by eye from the official art in third_party/art/{tasks,placement,winter}/ (ludex.dev).
# Wood kinds: firewood = lightest disk/log, softwood = olive disk / red-brown log, hardwood = black.
# Task requirement: kind, milled (log) vs unmilled (disk), drying bonus stage 0/1/2 (R-055).
# Placement card: per cutting area (1-6) the unmilled wood added (R-037) and the areas that get 1 food
# (the two areas shown either side of the food cube at the bottom of the card).
# Winter card: food/heating per printed half; `top`/`bottom` is the half as printed on the image
# (bottom half is upside-down); the easier half (lower food+heating) is derived, not stored (R-117).

