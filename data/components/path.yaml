      - {id: joinery_20, number: 20, kind: token_spot, name: "Token spot 20", capacity: 1}
      - {id: joinery_21, number: 21, kind: market, name: "Market", capacity: 4}
      - {id: joinery_22, number: 22, kind: token_spot, name: "Token spot 22", capacity: 1}

# Forest clearing (R-024): four ordered slots after the last location, one player at most per slot.
forest_clearing:
  slots: [A, B, C, D]
  capacity_per_slot: 1

# Token spots per side (R-023); the 13 mixed path tokens fill one spot each (R-017).
token_spot_count: 13
