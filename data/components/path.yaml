# Lignum supply-path data (RULES_SPEC R-002, R-021..R-025, R-032). Component values live only here.
# Sources: the Lignum base rulebook p.2 and third_party/art/boards/board.webp (20-location side);
# third_party/rules/photos/board_joinery_side.jpg (22-location side); Buildings capacity 2 from D20
# (PLAN.md C1; the spec's 2 is followed). Locations are listed in path order; number is the printed
# number and the order (R-032). kind names the acquisition; token_spot holds one of the 13 path tokens (R-023).
# capacity is the number of foremen that may stand on the location at once (R-040). The foremen start
# on location 0 (R-016), which is not a location here. Numbers are qualified by side in ids.

sides:
  base:
    locations:
      - {id: base_1, number: 1, kind: token_spot, name: "Token spot 1", capacity: 1}
      - {id: base_2, number: 2, kind: token_spot, name: "Token spot 2", capacity: 1}
      - {id: base_3, number: 3, kind: token_spot, name: "Token spot 3", capacity: 1}
      - {id: base_4, number: 4, kind: bearers, name: "Bearers", capacity: 4}
      - {id: base_5, number: 5, kind: token_spot, name: "Token spot 5", capacity: 1}
      - {id: base_6, number: 6, kind: fodder, name: "Fodder", capacity: 2}
      - {id: base_7, number: 7, kind: token_spot, name: "Token spot 7", capacity: 1}
      - {id: base_8, number: 8, kind: planned_work, name: "Planned Work", capacity: 4}
