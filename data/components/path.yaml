      - {id: joinery_1, number: 1, kind: token_spot, name: "Token spot 1", capacity: 1}
      - {id: joinery_2, number: 2, kind: token_spot, name: "Token spot 2", capacity: 1}
      - {id: joinery_3, number: 3, kind: token_spot, name: "Token spot 3", capacity: 1}
