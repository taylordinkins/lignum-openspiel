      - {id: base_10, number: 10, kind: woodcutters, name: "Woodcutters", capacity: 4}
      - {id: base_11, number: 11, kind: token_spot, name: "Token spot 11", capacity: 1}
      - {id: base_12, number: 12, kind: token_spot, name: "Token spot 12", capacity: 1}
      - {id: base_13, number: 13, kind: tasks, name: "Tasks", capacity: 4}
