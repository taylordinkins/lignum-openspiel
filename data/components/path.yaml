      - {id: joinery_6, number: 6, kind: fodder, name: "Fodder", capacity: 2}
      - {id: joinery_7, number: 7, kind: token_spot, name: "Token spot 7", capacity: 1}
      - {id: joinery_8, number: 8, kind: planned_work, name: "Planned Work", capacity: 4}
      - {id: joinery_9, number: 9, kind: token_spot, name: "Token spot 9", capacity: 1}
      - {id: joinery_10, number: 10, kind: woodcutters, name: "Woodcutters", capacity: 4}
      - {id: joinery_11, number: 11, kind: token_spot, name: "Token spot 11", capacity: 1}
      - {id: joinery_12, number: 12, kind: buildings, name: "Buildings", capacity: 2}
      - {id: joinery_13, number: 13, kind: token_spot, name: "Token spot 13", capacity: 1}
